# The integration suites need the Docker Jellyfin (test/integration/README.md)
# and race each other in parallel, so a plain `dart test` skips them. Run
# everything, one file at a time, with:
#
#     dart test -P integration
#
# and only the integration suites with `dart test -P integration
# test/integration` — by path, because with a preset `--tags` does not
# narrow the run.
tags:
  integration:
    skip: 'needs the Docker Jellyfin: run with -P integration'
  # Read-only checks against a server named by environment variables
  # (see test/live_server_test.dart).
  live:
  # Tests that reach the internet (the upstream spec drift check). Run
  # them with `dart test -P network test/spec_drift_watchdog_test.dart`.
  network:
    skip: 'reaches api.jellyfin.org: run with -P network'

presets:
  integration:
    concurrency: 1
    tags:
      integration:
        skip: false
  network:
    tags:
      network:
        skip: false
