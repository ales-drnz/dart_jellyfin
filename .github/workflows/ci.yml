name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  # Weekly: the integration suite against Jellyfin in Docker and the
  # upstream spec drift check, which no push runs.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      integration:
        description: Run the integration suite against Jellyfin in Docker
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pubspec floor and the current stable.
        sdk: ['3.10.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze --fatal-infos

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .

  test:
    name: Test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.10.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # The integration suites are tagged and skipped here (dart_test.yaml).
      - run: dart test

  test-web:
    name: Test (compiled to JavaScript, on Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      # The web build of the library (transport/platform_web.dart, no
      # isolates), through an injected client. The suites left out read
      # files or use dart:io sockets or dart:mirrors.
      - run: >-
          dart test -p node
          test/jellyfin_json_test.dart
          test/jellyfin_models_test.dart
          test/jellyfin_account_models_test.dart
          test/jellyfin_config_models_test.dart
          test/jellyfin_live_tv_models_test.dart
          test/jellyfin_metadata_models_test.dart
          test/jellyfin_plugin_models_test.dart
          test/jellyfin_server_models_test.dart
          test/jellyfin_storage_models_test.dart
          test/jellyfin_dto_fields_test.dart
          test/jellyfin_typed_answers_test.dart
          test/jellyfin_paging_test.dart
          test/jellyfin_browse_query_shape_test.dart
          test/jellyfin_live_tv_api_test.dart
          test/jellyfin_music_api_test.dart
          test/jellyfin_service_regressions_test.dart
          test/jellyfin_notifications_api_test.dart
      # The example must compile for the web too.
      - run: dart compile js example/dart_jellyfin_example.dart -o /tmp/example.js

  downgrade:
    name: Lowest dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.10.0'
      # The package's own dependencies at the lowest versions the
      # resolver allows, on the lowest SDK. Not a bare `dart pub
      # downgrade`: that also takes the test runner's dependencies back
      # to versions that no longer compile.
      - run: dart pub get
      - run: dart pub downgrade http meta web_socket_channel
      - run: dart analyze --fatal-infos
      - run: dart test

  spec-drift:
    name: Upstream spec drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      # Prints the operations api.jellyfin.org added or removed since the
      # pinned document (dart_test.yaml, the network tag).
      - run: dart test -P network test/spec_drift_watchdog_test.dart

  publish:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart pub publish --dry-run

  transport-drift:
    name: Transport drift against dart_plex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dart_jellyfin
      # The sibling's branch: main from main; otherwise the branch of the
      # same name, else its newest release/* branch, else main. A transport
      # change lands in both repositories on release branches first.
      - name: Check out dart_plex
        run: |
          url=https://github.com/ales-drnz/dart_plex.git
          ref=main
          if [ "$BRANCH" != main ]; then
            if git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then
              ref=$BRANCH
            else
              newest=$(git ls-remote --heads "$url" 'release/*' \
                | sed 's|.*refs/heads/||' | sort -V | tail -n 1)
              ref=${newest:-main}
            fi
          fi
          echo "dart_plex at $ref"
          git clone --depth 1 --branch "$ref" "$url" dart_plex
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Compare the shared transport
        working-directory: dart_jellyfin
        run: |
          dart pub get
          dart run tool/transport_drift.dart ../dart_plex .

  integration:
    name: Integration (Jellyfin in Docker)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.integration)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - name: Install ffmpeg for the seed media
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Write test/integration/.env.test
        run: cp test/integration/.env.test.example test/integration/.env.test
      # Brings up the stack with docker compose
      # (test/integration/docker-compose.yml) and readies the server.
      - run: dart run test/integration/bootstrap.dart
      # By path: with a preset, `--tags` does not narrow the run.
      - run: dart test -P integration test/integration
      - name: Server log on failure
        if: failure()
        run: docker logs dart-jellyfin-test 2>&1 | tail -200
      - name: Tear down
        if: always()
        run: docker compose -f test/integration/docker-compose.yml --env-file test/integration/.env.test down -v
