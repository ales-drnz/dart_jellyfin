name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run the integration suite against Jellyfin in Docker
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pubspec floor and the current stable.
        sdk: ['3.10.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze --fatal-infos

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # The integration suites are skipped without -P integration.
      - run: dart test

  publish:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run

  transport-drift:
    name: Transport drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dart_jellyfin
      - uses: actions/checkout@v4
        with:
          repository: ales-drnz/dart_plex
          path: dart_plex
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: dart_jellyfin
      - run: dart run tool/transport_drift.dart ../dart_plex .
        working-directory: dart_jellyfin

  integration:
    name: Integration (Jellyfin in Docker)
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install ffmpeg for the seed media
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dart pub get
      - name: Bootstrap the server
        run: |
          cp test/integration/.env.test.example test/integration/.env.test
          dart run test/integration/bootstrap.dart
      - run: dart test -P integration --tags integration
      - name: Server log on failure
        if: failure()
        run: docker logs dart-jellyfin-test 2>&1 | tail -200
      - name: Tear down
        if: always()
        run: docker compose -f test/integration/docker-compose.yml --env-file test/integration/.env.test down -v
