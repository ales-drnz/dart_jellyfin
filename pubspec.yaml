name: dart_jellyfin
description: Dart client for Jellyfin 12.4 (12.0 or later). Authentication, library browsing, playlists, streaming, search, live events and more, on every Dart platform including the web.
version: 0.4.2
homepage: https://github.com/ales-drnz/dart_jellyfin
repository: https://github.com/ales-drnz/dart_jellyfin
issue_tracker: https://github.com/ales-drnz/dart_jellyfin/issues

topics:
  - jellyfin
  - media-server
  - music
  - streaming
  - api-client

screenshots:
  - description: 'The dart_jellyfin package logo.'
    path: imgs/dart_jellyfin.png

environment:
  sdk: ^3.10.0

dependencies:
  http: ^1.6.0
  meta: ^1.15.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.6
